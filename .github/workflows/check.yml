name: peios-go build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: peios-go-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libclang-dev pkg-config python3 python3-venv binutils nodejs npm
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
            - name: Select the Go runtime
              uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
              with:
                  go-version: "1.26.8"
                  cache: false
            - name: Select the shared JavaScript runtime
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.22.1"
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/peios-go-style"
            - name: Check out the consolidated C SDK
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/peios-sdk
                  ref: 76f350f231c715e22585f9bff8509c2f657496c4
                  path: .ci-sdk/peios-sdk
                  persist-credentials: false
            - name: Prepare the development SDK
              run: python3 tools/prepare-dev-sdk.py .ci-sdk/peios-sdk "$RUNNER_TEMP/peios-sdk"
            - name: Check out the Rust reference SDK
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/peios-rs
                  ref: a8eeb6a406bb040b16c5a3a8a2d4da3a4d31593b
                  path: .ci-sdk/peios-rs
                  persist-credentials: false
            - name: Check style, build, tests and packages
              env:
                  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
                  PEIOS_RUST_SDK: ${{ github.workspace }}/.ci-sdk/peios-rs
                  PEIOS_SDK: ${{ runner.temp }}/peios-sdk
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/peios-go-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/peios-go-cargo-checks
              run: tools/check
            - name: Check out the documentation compiler
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-sdk/trail
                  persist-credentials: false
            - name: Build the pinned documentation compiler
              working-directory: .ci-sdk/trail
              run: tools/bazel build //:trail
            - name: Check documentation
              env:
                  TRAIL: ${{ github.workspace }}/.ci-sdk/trail/bazel-bin/trail
              run: tools/check-docs
